<section class="kpi-grid">
  <!-- Ready Card -->
  <div
    class="kpi-card"
    [class.active-filter]="selectedFilter() === 'READY'"
    (click)="filterChange.emit('READY')"
  >
    <div class="kpi-header">
      <span class="kpi-title">READY</span>
      <span class="status-indicator ready-dot"></span>
    </div>
    <div class="kpi-value text-ready">{{ counts().READY }}</div>
    <div class="kpi-sub">Due / Scheduled</div>
  </div>

  <!-- Running Card -->
  <div
    class="kpi-card"
    [class.active-filter]="selectedFilter() === 'RUNNING'"
    (click)="filterChange.emit('RUNNING')"
  >
    <div class="kpi-header">
      <span class="kpi-title">RUNNING</span>
      <span class="status-indicator running-dot"></span>
    </div>
    <div class="kpi-value text-running">{{ counts().RUNNING }}</div>
    <div class="kpi-sub">Lease-Locked Active</div>
  </div>

  <!-- Done Card -->
  <div
    class="kpi-card"
    [class.active-filter]="selectedFilter() === 'DONE'"
    (click)="filterChange.emit('DONE')"
  >
    <div class="kpi-header">
      <span class="kpi-title">DONE</span>
      <span class="status-indicator done-dot"></span>
    </div>
    <div class="kpi-value text-done">{{ counts().DONE }}</div>
    <div class="kpi-sub">Successfully Drained</div>
  </div>

  <!-- Dead Letter Card -->
  <div
    class="kpi-card"
    [class.active-filter]="selectedFilter() === 'DEAD_LETTER'"
    (click)="filterChange.emit('DEAD_LETTER')"
  >
    <div class="kpi-header">
      <span class="kpi-title">DEAD-LETTER</span>
      <span class="status-indicator dead-dot"></span>
    </div>
    <div class="kpi-value text-dead">{{ counts().DEAD_LETTER }}</div>
    <div class="kpi-sub">Retries Exhausted &bull; Requeueable</div>
  </div>
</section>
