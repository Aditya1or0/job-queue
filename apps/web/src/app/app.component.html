<div class="dashboard-container">
  <!-- 1. Header Component -->
  <app-header
    [autoRefresh]="autoRefresh()"
    [isLoading]="isLoading()"
    (toggleAutoRefresh)="toggleAutoRefresh()"
    (refresh)="loadJobs()"
  />

  <!-- 2. KPI Summary Cards Component (#222 background, compact) -->
  <app-summary-cards
    [counts]="counts()"
    [selectedFilter]="selectedFilter()"
    (filterChange)="setFilter($event)"
  />

  <!-- 3. Filter Tabs & Search Toolbar -->
  <app-filter-toolbar
    [counts]="counts()"
    [selectedFilter]="selectedFilter()"
    [searchQuery]="searchQuery()"
    [totalJobs]="totalJobs()"
    (filterChange)="setFilter($event)"
    (searchQueryChange)="searchQuery.set($event)"
  />

  <!-- 4. Main Jobs Table Component with Expandable Attempt History -->
  <app-jobs-table
    [jobs]="filteredJobs()"
    [expandedJobIds]="expandedJobIds()"
    [attemptsMap]="attemptsMap()"
    [loadingAttemptsMap]="loadingAttemptsMap()"
    [requeueingMap]="requeueingMap()"
    (toggleExpand)="toggleExpand($event)"
    (requeue)="requeueJob($event)"
  />

  <!-- Footer -->
  <footer class="app-footer">
    <div>MySQL Queue Engine &bull; <strong>At-Least-Once Guarantees with Atomic Fencing Tokens</strong></div>
    <div class="text-dim">Last Updated: {{ formatTime(lastUpdated()) }}</div>
  </footer>
</div>
