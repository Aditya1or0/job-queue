<header class="app-header">
  <div class="header-branding">
    <div class="logo-badge">
      <svg class="logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
      </svg>
    </div>
    <div>
      <h1 class="app-title">Durable MySQL Delayed Job Queue</h1>
      <p class="app-subtitle">At-Least-Once Execution &bull; Atomic Lease Fencing &bull; Complete Attempt Audit</p>
    </div>
  </div>

  <div class="header-controls">
    <div class="live-indicator" [class.live]="autoRefresh()">
      <span class="pulse-dot"></span>
      <span>{{ autoRefresh() ? 'Live Sync (2s)' : 'Sync Paused' }}</span>
    </div>

    <button class="btn btn-secondary" (click)="toggleAutoRefresh.emit()">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path *ngIf="autoRefresh()" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
        <path *ngIf="!autoRefresh()" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"/>
        <path *ngIf="!autoRefresh()" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      </svg>
      {{ autoRefresh() ? 'Pause' : 'Resume' }}
    </button>

    <button class="btn btn-primary" (click)="refresh.emit()" [disabled]="isLoading()">
      <svg class="btn-icon" [class.spin]="isLoading()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
      </svg>
      Refresh
    </button>
  </div>
</header>
